# Produção com PostgreSQL interno: Next.js standalone atrás do Caddy com TLS.
#
#   docker compose -f compose.prod.yaml --env-file "$FEITO_ENV" up -d --wait
#
# FEITO_ORIGIN define o site do Caddy: um domínio público (https://feito.example.org)
# obtém certificado via ACME nas portas 80/443; localhost ou IP usa a CA interna.
# O Next.js e o PostgreSQL não publicam portas no host.
# O serviço postgres exige as senhas. Os defaults vazios permitem que o Compose
# externo reutilize os outros serviços e substitua suas URLs sem avisos.
name: feito

x-runtime-env: &runtime-env
  FEITO_ORIGIN: ${FEITO_ORIGIN:?Defina FEITO_ORIGIN}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET}
  DATA_KEK_ACTIVE_VERSION: ${DATA_KEK_ACTIVE_VERSION:?Defina DATA_KEK_ACTIVE_VERSION}
  DATA_KEK_V1: ${DATA_KEK_V1:?Defina DATA_KEK_V1}
  DATA_KEK_V2: ${DATA_KEK_V2:-}
  DATA_KEK_V3: ${DATA_KEK_V3:-}

x-image-platform: &image-platform linux/amd64 # Plataforma publicada no GHCR.

x-tools-image: &tools-image
  image: ghcr.io/danilo-alm/feito-tools:latest
  platform: *image-platform

services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports: !reset []
    restart: unless-stopped

  migrate:
    <<: *tools-image
    command: ["pnpm", "db:migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://feito_migrator:${POSTGRES_MIGRATOR_PASSWORD:-}@postgres:5432/feito
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/danilo-alm/feito:latest
    platform: *image-platform
    environment:
      <<: *runtime-env
      IMPORT_PREVIEW_SECRET: ${IMPORT_PREVIEW_SECRET:?Defina IMPORT_PREVIEW_SECRET}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-}
      AUTH_CLIENT_IP_HEADER: x-real-ip
      DOMAIN_DATABASE_URL: postgresql://feito_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/feito
      AUTH_DATABASE_URL: postgresql://feito_auth:${POSTGRES_AUTH_PASSWORD:-}@postgres:5432/feito
    read_only: true
    tmpfs:
      - /app/.next/cache:uid=1000,gid=1000
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      FEITO_ORIGIN: ${FEITO_ORIGIN:?Defina FEITO_ORIGIN}
      FEITO_HTTPS_PORT: ${FEITO_HTTPS_PORT:-443}
    ports:
      - "${FEITO_HTTP_PORT:-80}:80"
      - "${FEITO_HTTPS_PORT:-443}:${FEITO_HTTPS_PORT:-443}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Operações sob demanda (não sobe com `up`):
  #   docker compose -f compose.prod.yaml --env-file "$FEITO_ENV" run --rm cli pnpm admin account:create --email pessoa@example.org
  cli:
    <<: *tools-image
    profiles: ["tools"]
    command: ["pnpm", "admin", "--help"]
    environment:
      <<: *runtime-env
      IDENTITY_ADMIN_DATABASE_URL: postgresql://feito_identity_admin:${POSTGRES_IDENTITY_ADMIN_PASSWORD:-}@postgres:5432/feito
      KEY_MAINTENANCE_DATABASE_URL: ${KEY_MAINTENANCE_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy-data:
  caddy-config:
