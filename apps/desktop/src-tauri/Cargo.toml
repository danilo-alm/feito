[package]
name = "feito-desktop"
version = "0.4.0-beta"
description = "Aplicativo desktop do Feito"
edition = "2021"

[features]
sqlite-proof = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chacha20poly1305 = "0.10.1"
cookie = "0.18"
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
zeroize = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
