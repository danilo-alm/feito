# Acrescente este arquivo ao compose.prod.external.yaml para montar a CA do banco.
x-postgres-ca: &postgres-ca
  type: bind
  source: ${FEITO_POSTGRES_CA_FILE:?Defina FEITO_POSTGRES_CA_FILE com o caminho absoluto do certificado}
  target: /run/config/feito-postgres-ca.crt
  read_only: true
  bind:
    create_host_path: false

services:
  migrate:
    volumes: [*postgres-ca]
  app:
    volumes: [*postgres-ca]
  cli:
    volumes: [*postgres-ca]
