name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Integração: PostgreSQL 18 descartável, com segredos gerados nesta execução.
      - name: Subir PostgreSQL e migrar
        run: |
          scripts/new-env.sh "$RUNNER_TEMP/test.env"
          docker compose -p feito-test --env-file "$RUNNER_TEMP/test.env" up -d --wait postgres
          set -a; . "$RUNNER_TEMP/test.env"; set +a
          pnpm db:migrate

      - name: Testes de integração
        run: |
          set -a; . "$RUNNER_TEMP/test.env"; set +a
          pnpm test:integration

      - name: Logs do PostgreSQL em caso de falha
        if: failure()
        run: docker compose -p feito-test --env-file "$RUNNER_TEMP/test.env" logs postgres

  publish:
    # Só publica em push na main ou na dev, depois de os testes passarem.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: feito
            target: prod
          - image: feito-tools
            target: tools
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
