name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # PostgreSQL 18 descartável, com segredos gerados nesta execução.
      - name: Subir PostgreSQL e migrar
        run: |
          scripts/new-env.sh "$RUNNER_TEMP/test.env" https://127.0.0.1:3100
          docker compose -p feito-test --env-file "$RUNNER_TEMP/test.env" up -d --wait postgres
          set -a; . "$RUNNER_TEMP/test.env"; set +a
          pnpm db:migrate

      - name: Verificar imagens dos Compose de produção
        run: |
          for file in compose.prod.yaml compose.prod.external.yaml; do
            echo "Validando $file"
            docker compose -f "$file" --env-file "$RUNNER_TEMP/test.env" --profile tools config --format json |
              jq -e '.services |
                .app.image == "ghcr.io/danilo-alm/feito:latest" and
                .migrate.image == "ghcr.io/danilo-alm/feito-tools:latest" and
                .cli.image == .migrate.image and
                ([.app, .migrate, .cli] | all(.[]; .platform == "linux/amd64")) and
                all(.[]; has("build") | not)'
          done

      - name: Verificar montagem da CA do PostgreSQL externo
        run: |
          export FEITO_POSTGRES_CA_FILE="$RUNNER_TEMP/postgres-ca.crt"
          docker compose -f compose.prod.external.yaml -f compose.prod.external.ca.yaml \
            --env-file "$RUNNER_TEMP/test.env" --profile tools config --format json |
            jq -e '.services |
              ([.migrate, .app, .cli] | all(.[]; any(.volumes[]?;
                .type == "bind" and .source == env.FEITO_POSTGRES_CA_FILE and
                .target == "/run/config/feito-postgres-ca.crt" and .read_only == true and
                .bind.create_host_path == false)))'

      - name: Verificar porta HTTPS do Caddy
        run: |
          check_caddy_port() {
            local origin="$1" port="$2" file="$3" config
            config=$(FEITO_ORIGIN="$origin" FEITO_HTTPS_PORT="$port" \
              docker compose -f "$file" --env-file "$RUNNER_TEMP/test.env" config --format json | jq '.services.caddy')
            jq -e --arg port "$port" 'any(.ports[]; .published == $port and .target == ($port | tonumber))' \
              <<< "$config"
            docker run --rm -i --network none \
              -e "FEITO_ORIGIN=$(jq -r '.environment.FEITO_ORIGIN' <<< "$config")" \
              -e "FEITO_HTTPS_PORT=$(jq -r '.environment.FEITO_HTTPS_PORT // empty' <<< "$config")" \
              "$(jq -r '.image' <<< "$config")" caddy adapt --adapter caddyfile --config /dev/stdin < docker/Caddyfile |
              jq -e --arg port ":$port" --arg location "$origin{http.request.uri}" '.apps.http.servers |
                any(.[]; .listen | index($port) != null) and
                any(.[] | select(.listen | index(":80")) | .routes[]?.handle[]?;
                  .handler == "static_response" and .status_code == 308 and .headers.Location == [$location])'
          }
          check_caddy_port https://feito.example.com 8083 compose.prod.yaml
          check_caddy_port https://feito.example.com 8083 compose.prod.external.yaml
          check_caddy_port https://localhost:3000 3000 compose.prod.yaml
          check_caddy_port https://localhost:3000 3000 compose.dev.yaml

      - name: Verificar origem HTTP do Cloudflare Tunnel
        env:
          FEITO_ORIGIN: https://feito.example.com
          FEITO_HTTP_PORT: "8084"
          FEITO_HTTPS_PORT: "8083"
        run: |
          for file in compose.prod.yaml compose.prod.external.yaml; do
            docker compose -f "$file" -f compose.prod.tunnel.yaml \
              --env-file "$RUNNER_TEMP/test.env" config --format json |
              jq -e '.services.caddy |
                (.ports | length == 1 and .[0].host_ip == "127.0.0.1" and
                  .[0].published == "8084" and .[0].target == 80) and
                any(.volumes[]; (.source | endswith("/docker/Caddyfile.tunnel")) and
                  .target == "/etc/caddy/Caddyfile" and .read_only)'
          done
          docker run --rm -i --network none --add-host app:127.0.0.1 -e FEITO_ORIGIN \
            --entrypoint sh caddy:2.10-alpine -eu -c '
              cat > /tmp/Caddyfile
              printf "\nhttp://:3000 {\n\trespond {http.request.header.X-Forwarded-Proto}\n}\n" >> /tmp/Caddyfile
              caddy run --config /tmp/Caddyfile --adapter caddyfile >/tmp/caddy.log 2>&1 &
              for attempt in 1 2 3 4 5; do
                if body=$(wget -qO- --header="X-Forwarded-Proto: https" http://127.0.0.1/); then
                  test "$body" = https
                  response=$(wget -SO /dev/null --header="X-Forwarded-Proto: http" \
                    "http://127.0.0.1/prova?x=1" 2>&1 || true)
                  printf "%s\n" "$response" | grep -F "308 Permanent Redirect"
                  printf "%s\n" "$response" | grep -Fi "Location: $FEITO_ORIGIN/prova?x=1"
                  exit 0
                fi
                sleep 1
              done
              cat /tmp/caddy.log
              exit 1' < docker/Caddyfile.tunnel

      - name: Testes unitários e de integração com cobertura
        run: |
          set -a; . "$RUNNER_TEMP/test.env"; set +a
          pnpm test:coverage

      - name: Instalar Chromium headless
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Testes ponta a ponta em HTTPS
        run: |
          set -a; . "$RUNNER_TEMP/test.env"; set +a
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/feito-test.key" -out "$RUNNER_TEMP/feito-test.crt"
          FEITO_E2E_URL="$FEITO_ORIGIN" FEITO_E2E_KEY="$RUNNER_TEMP/feito-test.key" \
            FEITO_E2E_CERT="$RUNNER_TEMP/feito-test.crt" NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/feito-test.crt" \
            pnpm test:e2e

      - name: Logs do PostgreSQL em caso de falha
        if: failure()
        run: docker compose -p feito-test --env-file "$RUNNER_TEMP/test.env" logs postgres

  publish:
    # Só publica em push na main ou na dev, depois de os testes passarem.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: feito
            target: prod
          - image: feito-tools
            target: tools
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
