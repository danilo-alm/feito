name: Desktop CI and Release

# Todos os PRs recebem os checks da matriz. Tags e execuções manuais geram instaladores.
on:
  push:
    branches: [main, dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag existente para publicar os instaladores, por exemplo v1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    env:
      RUST_TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'

    steps:
      - name: Check out Feito
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify release version
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/check-release-version.mjs

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target "$RUST_TARGET"
          rustup default stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf xdg-utils

      # SQLCipher builds OpenSSL from source on Windows. Git Bash's MSYS Perl lacks modules that
      # OpenSSL's Configure needs, so openssl-src must use Strawberry Perl instead.
      - name: Use Strawberry Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          if (-not (Test-Path $perl)) { throw "Strawberry Perl not found at $perl" }
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { throw 'Strawberry Perl is missing modules required by OpenSSL' }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        run: pnpm --filter @feito/desktop... install --frozen-lockfile

      - name: Check frontend and run tests
        working-directory: apps/desktop
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Check Rust format and run tests
        working-directory: apps/desktop
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --features sqlite-proof

      # A fixed certificate keeps the app's identity the same across releases, so macOS remembers
      # "Always Allow" for the Feito keychain items. Without the secrets, it falls back to ad hoc.
      - name: Set up macOS code signing
        if: runner.os == 'macOS' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/setup-macos-signing.sh

      - name: Build and package the app
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --ci --target "$RUST_TARGET" --bundles "$BUNDLES" -- --locked

      # Os nomes publicados identificam sistema e arquitetura. Pacotes deb e rpm mantêm o formato
      # nativo do Tauri, apenas em minúsculas.
      - name: Collect installers
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p installers
          bundle_dir="apps/desktop/src-tauri/target/$RUST_TARGET/release/bundle"
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          linux_arch="${RUST_TARGET%%-*}"
          arch=x64
          if [[ "$linux_arch" == aarch64 ]]; then arch=arm64; fi
          IFS=, read -ra bundles <<< "$BUNDLES"
          for bundle in "${bundles[@]}"; do
            extension="$bundle"
            name=
            case "$bundle" in
              appimage) extension=AppImage name="Feito-$version-linux-$linux_arch.AppImage" ;;
              nsis) extension=exe name="Feito-$version-windows-$arch-setup.exe" ;;
              msi) name="Feito-$version-windows-$arch.msi" ;;
              dmg) name="Feito-$version-macos-$arch.dmg" ;;
            esac
            files=("$bundle_dir/$bundle/"*."$extension")
            if [[ "${#files[@]}" -ne 1 || ! -f "${files[0]}" ]]; then
              echo "::error::Esperado um instalador .$extension para $RUST_TARGET."
              exit 1
            fi
            if [[ -z "$name" ]]; then
              name="$(basename "${files[0]}" | tr '[:upper:]' '[:lower:]')"
            fi
            cp "${files[0]}" "installers/$name"
          done

      - name: Save installers
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: installers/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          path: installers

      - name: Publish all installers from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          artifacts=()
          collect() {
            local target="$1" extension
            shift
            for extension in "$@"; do
              local files=(installers/"installers-$target"/*."$extension")
              if [[ "${#files[@]}" -ne 1 ]]; then
                echo "::error::Esperado um instalador .$extension para $target."
                return 1
              fi
              artifacts+=("${files[0]}")
            done
          }
          collect x86_64-unknown-linux-gnu deb rpm AppImage
          collect aarch64-unknown-linux-gnu deb rpm AppImage
          collect x86_64-pc-windows-msvc msi exe
          collect aarch64-pc-windows-msvc exe
          collect x86_64-apple-darwin dmg
          collect aarch64-apple-darwin dmg

          if status="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$status" == true ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Feito $RELEASE_TAG" --generate-notes
          fi
